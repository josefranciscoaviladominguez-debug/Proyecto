<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Liga de Lucha Canaria - Gran Canaria</title>
   <link rel="stylesheet" href="/CSS/stylecontacto.css">
</head>
<body>

    <!-- Cabecera y Menú -->
    <header class="main-header">
        <div class="logo"><img src="/Imagenes/logo.png" alt="Logo Liga Lucha Canaria"></a></div>
        <nav class="main-nav">
            <ul>
                <li><a href="/Index/inicio.html">Inicio</a></li>
                <li><a href="">Noticias</a></li>
                <li><a href="">Equipos</a></li>
                <li><a href="/Index/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="info-semanal">
            <h1>Imagenes de la lucha canaria</h1>
            <p>Estas imagenes son las que han sacados nuestra aficion.</p>
        </section>
       
        <section id="contacto" class="seccion-contacto">
            <h2>Contacto</h2>
            <div class="contacto-contenedor">
                
                <!-- Formulario -->
                <form action="#" method="post" class="form-contacto">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="asunto">Interés:</label>
                    <select id="asunto" name="asunto">
                        <option value="general">Información General</option>
                        <option value="clubs">Fichas de Clubes</option>
                        <option value="prensa">Prensa</option>
                    </select>

                    <fieldset>
                        <legend>¿Eres luchador activo?</legend>
                        <input type="radio" id="si" name="luchador" value="si">
                        <label for="si">Sí</label>
                        <input type="radio" id="no" name="luchador" value="no">
                        <label for="no">No</label>
                    </fieldset>

                    <button type="submit">Enviar Mensaje</button>
                </form>

                <!-- Mapa de Google -->
                <div class="mapa">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d112763.5015942516!2d-15.4883445!3d28.1173558!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xc409193278a23d1%3A0x2863c01f654f1508!2sGran%20Canaria!5e0!3m2!1ses!2ses!4v1700000000000" 
                    width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer class="main-footer">
        <p>Federación de Lucha Canaria de Gran Canaria © 2026</p>
    </footer>

</body>
</html>
